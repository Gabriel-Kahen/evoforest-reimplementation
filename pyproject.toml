[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evoforest-reimplementation"
version = "0.1.0"
description = "A clean-room reimplementation of the EvoForest paper architecture."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]
torch = [
  "torch>=2.3",
]
research = [
  "scikit-learn==1.6.1",
  "autofeat==2.1.3",
]
research-symbolic = [
  "pysr==1.5.10",
]

[project.scripts]
evoforest-arch = "evoforest_arch.cli:main"
evoforest-benchmarks = "benchmarks.run_all:main"

[tool.setuptools.packages.find]
include = ["evoforest_arch*", "benchmarks*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
